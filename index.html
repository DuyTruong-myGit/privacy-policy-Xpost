<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPost - Pháp lý & Bảo mật</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f9fafb;
            --text: #111827;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
        .links { display: flex; flex-direction: column; gap: 1rem; }
        a {
            text-decoration: none;
            color: white;
            background: var(--primary);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        a:hover { opacity: 0.9; }
        .footer { margin-top: 2rem; font-size: 0.875rem; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <h1>XPost Legal Center</h1>
        <div class="links">
            <a href="privacy.html">Chính sách quyền riêng tư</a>
            <a href="terms.html">Điều khoản dịch vụ</a>
        </div>
        <div class="footer">
            &copy; 2024 XPost. All rights reserved.
        </div>
    </div>
</body>
</html>
